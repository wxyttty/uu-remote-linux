<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
  }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif; font-size: 14px;
    background: rgba(0,0,0,0.75); z-index: 10;
    padding: 24px; box-sizing: border-box; text-align: center;
    white-space: pre-line;
  }
  #toolbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 8px; padding: 6px 10px;
    padding-top: calc(6px + env(safe-area-inset-top));
    z-index: 20;
    transition: opacity 0.2s;
  }
  #toolbar.hidden { opacity: 0; pointer-events: none; }
  .tb-btn {
    background: rgba(0,0,0,0.55); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 16px; padding: 8px 14px; font-size: 13px;
    min-width: 44px; text-align: center;
  }
  .spacer { flex: 1; }
  #stats {
    position: absolute; bottom: 8px; left: 8px;
    color: rgba(255,255,255,0.7); font-family: monospace; font-size: 11px;
    z-index: 20; text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="overlay">正在连接…</div>
<div id="toolbar" class="hidden">
  <div class="tb-btn" id="btn-keyboard">⌨</div>
  <div class="tb-btn" id="btn-scroll">🖱</div>
  <div class="tb-btn" id="btn-quality">画质</div>
  <div class="spacer"></div>
  <div class="tb-btn" id="btn-disconnect">断开</div>
</div>
<div id="stats"></div>
<input id="kbd-input" autocomplete="off" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;">
<script src="remote.js"></script>
</body>
</html>
